[versions]
agp = "9.2.1"
biometric = "1.1.0"
common = "d532608ca4"
gson = "2.14.0"
material = "1.14.0"
multidex = "2.0.1"
zxing = "1.9.8"

[libraries]
adapters = { module = "com.github.sunilpaulmathew.sCommon:adapters", version.ref = "common" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
crashreporter = { module = "com.github.sunilpaulmathew.sCommon:crashreporter", version.ref = "common" }
fileutils = { module = "com.github.sunilpaulmathew.sCommon:fileutils", version.ref = "common" }
